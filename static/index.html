<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Document Assistant</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .container {
            width: 800px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .section {
            margin-bottom: 25px;
        }

        input[type="file"] {
            margin-bottom: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        textarea {
            width: 100%;
            height: 100px;
            resize: none;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .response-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #007bff;
            white-space: pre-wrap;
        }

        .status {
            margin-top: 10px;
            font-weight: bold;
        }

        .loading {
            color: orange;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>📚 RAG Document Assistant</h1>

    <!-- Upload Section -->
    <div class="section">
        <h2>Upload Document</h2>

        <input type="file" id="fileInput">

        <button onclick="uploadFile()">
            Upload
        </button>

        <div id="uploadStatus" class="status"></div>
    </div>

    <!-- Question Section -->
    <div class="section">
        <h2>Ask a Question</h2>

        <textarea
            id="question"
            placeholder="Ask something about the uploaded document..."
        ></textarea>

        <br><br>

        <button onclick="askQuestion()">
            Ask
        </button>

        <div id="queryStatus" class="status"></div>

        <div id="answerBox" class="response-box" style="display:none;">
        </div>
    </div>

</div>

<script>

async function uploadFile() {

    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('uploadStatus');

    if (!fileInput.files.length) {
        status.className = "status error";
        status.textContent = "Please choose a file.";
        return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    status.className = "status loading";
    status.textContent = "Uploading...";

    try {

        const response = await fetch('http://127.0.0.1:5500/upload', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error);
        }

        status.className = "status success";
        status.textContent = data.message;

    } catch (error) {

        status.className = "status error";
        status.textContent = error.message;
    }
}

async function askQuestion() {

    const question = document.getElementById('question').value;
    const status = document.getElementById('queryStatus');
    const answerBox = document.getElementById('answerBox');

    if (!question.trim()) {
        status.className = "status error";
        status.textContent = "Please enter a question.";
        return;
    }

    status.className = "status loading";
    status.textContent = "Thinking...";

    answerBox.style.display = "none";

    try {

        const response = await fetch('http://127.0.0.1:5500/query', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error);
        }

        status.className = "status success";
        status.textContent = "Answer generated.";

        answerBox.style.display = "block";
        answerBox.innerHTML = `
            <strong>Question:</strong><br>
            ${data.question}
            <br><br>
            <strong>Answer:</strong><br>
            ${data.answer}
        `;

    } catch (error) {

        status.className = "status error";
        status.textContent = error.message;
    }
}

</script>

</body>
</html>
